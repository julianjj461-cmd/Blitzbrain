<style>
:root{--b1:#5a2fe0;--b2:#7a4dff;--c1:#3a2380;--c2:#2a1768;--tb:#1a0f45;--g1:#3b1a8f;--g2:#120b2e;--pink:#ff3d8b;--yel:#ffd23f;--cyan:#27e1ff;--grn:#3dffa0;--red:#ff4d4d;--mut:#b9a9f5;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
input,select,textarea{font-size:16px!important}
body{background:radial-gradient(120% 80% at 50% 0,var(--g1),var(--g2) 70%) fixed;color:#fff;font:600 16px system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#app{height:100%;position:relative;z-index:1}#bgf{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}#bgf span{position:absolute;opacity:.1;animation:flt 20s ease-in-out infinite}@keyframes flt{0%,100%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(14px,-30px) rotate(10deg)}}@media (prefers-reduced-motion:reduce){#bgf span{animation:none}}.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.chip{background:rgba(255,255,255,.12);border-radius:14px;padding:6px 12px;font-weight:800;font-size:13px;white-space:nowrap}#ver{position:fixed;top:calc(4px + env(safe-area-inset-top,0px));right:10px;font-size:10px;opacity:.45;z-index:5;pointer-events:none;letter-spacing:.5px}
.scr{max-width:480px;margin:0 auto;height:100%;overscroll-behavior-y:contain;padding:16px 16px 0;display:flex;flex-direction:column;gap:12px;overflow-y:auto;animation:in .25s}
.play{animation:none}
.scr:not(:has(.tb)){padding-bottom:16px}
.tb{position:sticky;bottom:0;z-index:50;isolation:isolate;box-shadow:0 -14px 14px -4px var(--tb);display:flex;gap:10px;margin:auto -16px 0;padding:10px 16px 16px;background:var(--tb)}.tb .btn{flex:1}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.logo{font:900 clamp(44px,15vw,64px)/.9 var(--ff);margin:10px 0 0;text-align:center;letter-spacing:-2px;transform:rotate(-3deg)}
.logo.sm{font-size:clamp(32px,10.5vw,44px);margin-top:4px}
.logo span{display:block;color:var(--yel);text-shadow:4px 4px 0 var(--pink)}
.sub{text-align:center;color:var(--mut);margin:4px 0 8px}
.btn{border:0;border-radius:20px;padding:18px;font:900 20px system-ui;color:#1a0b45;background:linear-gradient(180deg,var(--yel),#ffab2e);box-shadow:0 6px 0 #b66a00;touch-action:manipulation;width:100%}
.btn,.ar,.dp{position:relative}.btn::after,.ar::after,.dp::after{content:'';position:absolute;left:0;right:0;top:0;bottom:-6px;border-radius:inherit}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b66a00}
.btn.pink{background:linear-gradient(180deg,#ff6fa8,var(--pink));color:#fff;box-shadow:0 6px 0 #a00f4c}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.btn.sm{padding:12px;font-size:15px;border-radius:16px}
.row{display:flex;gap:10px}.row>*{flex:1}
.pl{display:flex;gap:8px}
.pl input{flex:1;min-width:0;border:2px solid rgba(255,255,255,.2);border-radius:16px;background:rgba(255,255,255,.1);color:#fff;font:700 18px system-ui;padding:14px;user-select:text}
.pl button{width:52px;border:0;border-radius:16px;background:rgba(255,77,77,.3);color:#fff;font-size:20px}
.card{background:rgba(255,255,255,.1);border-radius:20px;padding:14px}
.big{font:900 clamp(44px,16vw,72px)/1 var(--ff);text-align:center;font-variant-numeric:tabular-nums}
.c{text-align:center}.mut{color:var(--mut)}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.hud{display:flex;justify-content:space-between;align-items:center;font:900 20px system-ui}
.hud #tm{font-size:30px;color:var(--yel);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px}.dots i{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.2)}.dots i.on{background:var(--cyan);height:12px;margin-top:-2px}.dots i.dn{background:#fff}
.hint{text-align:center;color:var(--mut);min-height:22px}
#stg{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;position:relative}
.grid{display:grid;gap:10px;width:100%}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.tile{border:0;border-radius:16px;color:#fff;font:900 clamp(24px,8vw,36px) var(--ff);aspect-ratio:1;box-shadow:0 5px 0 rgba(0,0,0,.3);touch-action:manipulation;padding:0;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.g3 .tile{aspect-ratio:1.15}.g2 .tile{aspect-ratio:2/1}
.tile.sq{border-radius:10px;box-shadow:none}
.tile.txt{aspect-ratio:auto;padding:22px 0;background:linear-gradient(180deg,var(--b2),var(--b1))}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.ball{border-radius:50%;aspect-ratio:1;box-shadow:inset -6px -8px 0 rgba(0,0,0,.2)}
.off{visibility:hidden}
.hole{background:var(--c1);font-size:44px;box-shadow:inset 0 6px 0 rgba(0,0,0,.4);text-shadow:none}
.mp{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%}.mp i{aspect-ratio:1;border-radius:4px;background:rgba(255,255,255,.15)}.mp i.on{background:#fff}
.mb{padding:14px!important}.mb .mp{width:75%;margin:auto}
.emo{background:rgba(255,255,255,.12);text-shadow:none}
.ico{font-size:34px;text-align:center;margin-bottom:14px}
.pad{width:100%;aspect-ratio:auto!important;height:40vh;font-size:34px}
.word{font:900 clamp(46px,15vw,76px) var(--ff);text-align:center;margin-bottom:8px;-webkit-text-stroke:2px rgba(0,0,0,.35)}
.eq{font:900 clamp(40px,13vw,60px) var(--ff);text-align:center;margin-bottom:24px}
.rx{position:fixed;bottom:140px;font-size:58px;text-align:center;pointer-events:none;z-index:99;animation:rxf 2s ease-out forwards}.rx small{display:block;font-size:14px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000}@keyframes rxf{0%{opacity:0;transform:translateY(20px) scale(.6)}15%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-170px) scale(1)}}
.pop{animation:pop2 .7s cubic-bezier(.2,1.7,.4,1) both}@keyframes pop2{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}.pod{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin:10px 0 4px}.pod>div{flex:1;text-align:center;border-radius:12px 12px 0 0;padding:6px 4px;background:linear-gradient(180deg,var(--c1),var(--c2));border:2px solid #5a3fb0;border-bottom:0;min-width:0}.pod b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pod .e{font-size:26px}.pod .p1{height:104px;border-color:var(--yel)}.pod .p2{height:84px}.pod .p3{height:70px}.cd{animation:cdp .8s ease-out both}@keyframes cdp{0%{transform:scale(1.8);opacity:0}30%{opacity:1}100%{transform:scale(1)}}.cdb{height:6px;border-radius:3px;background:#ffffff22;margin:18px 24px 0;overflow:hidden}.cdb i{display:block;height:100%;background:var(--yel);transition:width 1s linear}.bounce{display:inline-block;animation:bnc 1.1s ease-in-out infinite}@keyframes bnc{50%{transform:translateY(-12px) scale(1.12)}}.glow{animation:glw 1.4s ease-in-out infinite}@keyframes glw{50%{box-shadow:0 0 0 4px rgba(255,210,63,.55)}}@media (prefers-reduced-motion:reduce){.pop,.bounce,.glow{animation:none}}
.vb.sel{outline:3px solid var(--yel)}
.shake{animation:sh .25s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.flash{animation:fl .3s}@keyframes fl{0%{box-shadow:inset 0 0 0 100vmax rgba(255,77,77,.35)}}
.pen{position:fixed;left:50%;top:40%;transform:translateX(-50%);font:900 36px system-ui;color:var(--red);pointer-events:none;animation:up .8s forwards;text-shadow:0 3px 0 #000}
@keyframes up{to{transform:translate(-50%,-70px);opacity:0}}

/* ===== Design „Automat“ ===== */
:root{--bg:#0e0b1a;--pan:#1a1530;--pan2:#241d47;--tx:#f4f1ff;--soft:#c9c2ea;--dim:#3a3463;--mut:#8c84b8;--ink:#f4f1ff;--cy:#19f0ff;--ye:#ffe53b;--pk:#ff2e93;--gr:#7cff6b;--acc:#19f0ff;--sh:#ff2e93;--yel:#ffe53b;--cyan:#19f0ff;--grn:#7cff6b;--red:#ff2e93;--pink:#ff2e93;
--px:'Press Start 2P',ui-monospace,Menlo,Consolas,monospace;--vt:'VT323',ui-monospace,Menlo,Consolas,monospace;--ff:var(--px);--bd:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
--b1:#1a1530;--b2:#241d47;--c1:#1a1530;--c2:#1a1530;--tb:#0e0b1a;--g1:#0e0b1a;--g2:#0e0b1a;color-scheme:dark}
body{background-color:var(--bg)!important;background-image:linear-gradient(color-mix(in srgb,var(--acc) 9%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--acc) 9%,transparent) 1px,transparent 1px)!important;background-size:28px 28px!important;background-attachment:fixed!important;color:var(--tx);font:700 15px/1.35 var(--bd)}
#bgf{display:none}
#ver{color:var(--mut)!important;font:400 7px var(--px)}
.mut,.sub,.hint{color:var(--mut)}
.hint{font-size:13px}
/* Schrift: Pixel für Titel, Knöpfe, Zahlen */
.btn,.logo,.hud #tm,.big,.cd,.eq,.banner,.pen,.tile,.chip,.pill,.eloB b,.tabs button,.rk b,h1,h2,h3{font-family:var(--px)}
h2,h3{font-weight:400;line-height:1.5}
h3{font-size:11px;margin:10px 0 6px;color:var(--ye)}
h2{font-size:13px}
.btn{background:var(--acc);color:var(--bg);border:4px solid var(--acc);border-radius:0;box-shadow:5px 5px 0 var(--sh);padding:15px 10px 13px;font-size:12px;font-weight:400;line-height:1.5;letter-spacing:0;transition:none}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--sh)}
.btn::after{display:none}
.btn.pink{background:var(--pk);border-color:var(--pk);color:var(--tx);box-shadow:5px 5px 0 var(--ye)}
.btn.ghost{background:var(--pan);color:var(--tx);border:3px solid var(--mut);box-shadow:none}
.btn.ghost:active{transform:none;background:var(--pan2)}
.btn.sm{padding:11px 8px 9px;font-size:10px;border-radius:0}
.btn:disabled{opacity:.4}
.card{background:var(--pan);border:3px solid var(--mut)!important;border-radius:0;box-shadow:none;color:var(--tx)}
.card.dp,.card.ar{border-left-width:3px;border-radius:0;padding-left:14px}
.ar{border-left:3px solid var(--mut);border-radius:0}
.dp,.ar{color:var(--tx)!important;background:var(--pan)!important;box-shadow:5px 5px 0 var(--c)!important;border:3px solid var(--c)!important;border-radius:0!important;--c:var(--cy)}
.grid .dp:nth-child(3n+1),.grid .ar:nth-child(4n+1){--c:var(--cy)}
.grid .dp:nth-child(3n+2),.grid .ar:nth-child(4n+2){--c:var(--ye)}
.grid .dp:nth-child(3n),.grid .ar:nth-child(4n+3){--c:var(--pk)}
.grid .ar:nth-child(4n){--c:var(--gr)}
.chip,.fchip,.frx button{background:var(--pan);border:2px solid var(--mut);color:var(--tx);border-radius:0}
.chip{padding:6px 10px 4px;font-size:9px;font-weight:400}
.fchip b{color:var(--ye)}.fchip.me{outline:3px solid var(--ye);outline-offset:1px;background:var(--pan2)}
/* Logo */
.logo{font-weight:400;letter-spacing:0;text-transform:none;transform:none;color:var(--acc);text-shadow:3px 3px 0 var(--sh);font-size:clamp(24px,8vw,32px);line-height:1.35;margin:10px 0 0}
.logo.sm{font-size:19px;margin:2px 0 0}
.logo span{display:block;color:var(--acc);text-shadow:3px 3px 0 var(--sh);background:none;border:0;border-radius:0;padding:0;margin:0;transform:none}
.logo.sm span{border-width:0}
/* Spiel-HUD */
.hud{color:var(--mut);font:400 9px var(--px)}
.hud #tm{color:var(--acc);background:none;border:0;border-radius:0;box-shadow:none;padding:0;transform:none;text-shadow:3px 3px 0 var(--sh);font-size:26px;white-space:nowrap;flex:none}
.hud>span:first-child{min-width:0;font-size:9px;line-height:1.6;padding-right:8px}
.dots i{background:var(--dim);border:0;border-radius:0}.dots i.on{background:var(--cy);height:12px}.dots i.dn{background:var(--ye)}
.tile{border:4px solid var(--cy);border-radius:0;color:var(--tx);background:var(--pan);box-shadow:4px 4px 0 var(--cy);text-shadow:none;font-weight:400;font-size:clamp(18px,6.5vw,28px)}
.tile:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--cy)}
.tile:not(.sq):not(.txt):not(.emo){background-image:none!important}
.tile.sq{border-radius:0;box-shadow:none;border-width:2px}
.tile.txt{background:var(--pan);font-family:var(--bd);font-weight:800;font-size:17px;line-height:1.3}
.emo{background:var(--pan);font-family:system-ui}
.hole{background:var(--bg);border-color:var(--dim);box-shadow:none;color:var(--dim)}
.mp i{background:var(--dim);border-radius:0}.mp i.on{background:var(--ye)}
.word{-webkit-text-stroke:0;font-family:var(--px);font-weight:400;font-size:clamp(26px,9vw,40px)}
.eq{font-weight:400;font-size:clamp(24px,8vw,34px)}
.big{font-weight:400;font-size:clamp(20px,6vw,26px);line-height:1.4;overflow-wrap:anywhere}
.pen{color:var(--pk);background:var(--bg);border:3px solid var(--pk);border-radius:0;padding:6px 12px 4px;text-shadow:none;font-size:18px;font-weight:400}
.cd{color:var(--acc);text-shadow:8px 8px 0 var(--sh);font-weight:400;font-size:clamp(110px,40vw,170px)}
.cdr circle{stroke:var(--acc);stroke-width:7}.cdr.last circle{stroke:var(--pk)}
.banner{color:var(--ye);font-weight:400;font-size:16px;line-height:1.5}
.rk{background:var(--pan);border:3px solid var(--mut);border-radius:0;box-shadow:none;color:var(--tx);font-weight:700}
.rk b{font-size:10px;font-weight:400}
.rk.w{background:var(--ye);border-color:var(--ye);color:var(--bg)}
.pl input{background:var(--pan);border:3px solid var(--mut);color:var(--tx);border-radius:0;font:700 17px var(--bd)}
.pl input:focus{border-color:var(--cy);outline:0}
.pl button{background:var(--pk);border:3px solid var(--pk);color:var(--tx);border-radius:0}
input,select,textarea{font-family:var(--bd)}
.bk{background:var(--pan);border:3px solid var(--mut);color:var(--mut);border-radius:0;box-shadow:none;font-family:var(--px)}
.hd h2.ar{border:0!important;background:none!important;box-shadow:none!important;padding-left:0;color:var(--ye);font-size:12px;border-bottom:0;text-decoration:underline;text-decoration-color:var(--pk);text-decoration-thickness:4px;text-underline-offset:6px}
/* Tab-Leiste */
.tb{background:var(--bg);box-shadow:0 -14px 14px -4px var(--bg)}
.tb.tabs{background:var(--bg);border-top:4px solid var(--tx);box-shadow:none;gap:0;padding:0 0 env(safe-area-inset-bottom,0px);margin-left:-16px;margin-right:-16px}
.tabs button{text-transform:uppercase;color:var(--mut);font:400 7px/1.4 var(--px);letter-spacing:0;padding:12px 0 10px;border:0;border-radius:0!important;background:none!important;gap:6px}
.tabs button span{filter:grayscale(1);opacity:.7;font-size:18px}
.tabs button.on{background:var(--cy)!important;color:var(--bg)!important;border:0;border-radius:0!important}
.tabs button.on span{filter:none;opacity:1}
.tabs .dot,.tb .dot{background:var(--pk);color:var(--tx);border:2px solid var(--bg);border-radius:0;font-family:var(--px);font-size:7px}
/* Freunde / Raum / FFA */
.fcard{background:var(--pan);border:3px solid var(--mut);border-radius:0}.fcard.mine{border-color:var(--ye);box-shadow:5px 5px 0 var(--ye);background:var(--pan)}
.fsyms>span,.fsyms>button{background:var(--bg);border:2px solid var(--dim);border-radius:0}
.fb,.fo{background:var(--pan);color:var(--tx);border:3px solid var(--cy);border-radius:0;box-shadow:4px 4px 0 var(--cy)}
.fb.mine,.fo.mine{outline:0;background:var(--pan2);border-color:var(--ye);box-shadow:4px 4px 0 var(--ye)}
.fbar,.fbr .fbv{background:var(--dim);border:0;border-radius:0}.fbar i,.fbr .fbv i{background:var(--ye)}
.vb.sel,.fvb.sel,.fpb.hot{outline:3px solid var(--ye)}
.pod>div{background:var(--pan);border:3px solid var(--cy);border-bottom:0;border-radius:0;color:var(--tx)}
.frk{border:4px solid var(--cy);border-radius:0;box-shadow:5px 5px 0 var(--cy);color:var(--tx);background:var(--pan);font-family:var(--px);font-weight:400}.frk.go{background:var(--pan2);border-color:var(--gr);box-shadow:5px 5px 0 var(--gr);color:var(--gr)}
.ftap{background:var(--pan);border:4px solid var(--gr);border-radius:0;box-shadow:6px 6px 0 var(--gr);color:var(--gr);font-family:var(--px);font-weight:400;font-size:16px}
.flash{animation:none}
#fl.bad{box-shadow:inset 0 0 70px 10px rgba(255,46,147,.7)}#fl.ok{box-shadow:inset 0 0 60px 6px rgba(124,255,107,.45)}
#thg{display:grid!important;grid-template-columns:1fr 1fr}#thg .btn{font-size:9px;white-space:nowrap;min-width:0!important;padding-left:4px;padding-right:4px}
#thg .btn.sel{background:var(--acc);color:var(--bg)}
.bk{display:flex;align-items:center;justify-content:center;padding:0}.bk svg{display:block}
#ovl{background:rgba(14,11,26,.82)!important}
#ovl .card{background:var(--pan)!important;border:4px solid var(--ye)!important;box-shadow:6px 6px 0 var(--ye)}
.hb{background:var(--pan)!important;color:var(--tx)!important;border:4px solid var(--cy)!important;box-shadow:5px 5px 0 var(--cy)!important;font-family:var(--bd);font-weight:800}
.hb:nth-of-type(even){border-color:var(--pk)!important;box-shadow:5px 5px 0 var(--pk)!important}.hb:nth-of-type(3n){border-color:var(--ye)!important;box-shadow:5px 5px 0 var(--ye)!important}
.hb b{font:400 11px/1.5 var(--px)!important}.hb small{font-size:13px;opacity:1;color:var(--soft)}
.hb:active{transform:translate(4px,4px)}
.btn.ghost[style*=outline]{outline-color:var(--ye)!important;background:var(--pan2)}
/* Startseite */
.pill{display:inline-block;background:none;color:var(--ye);border-radius:0;padding:0;font:400 8px var(--px);letter-spacing:.06em}
.go{display:block;margin-top:14px;background:var(--ye);color:var(--bg);border-radius:0;height:auto;padding:14px 0 12px;font:400 12px var(--px);text-align:center}
.eloB{background:none;border:0;padding:0;text-align:right;flex:none}.eloB b{display:block;font-size:15px;line-height:1.3;color:var(--tx)}.eloB small{font:400 7px var(--px);color:var(--mut);display:block;margin-top:6px}
.btn.mt{padding:14px 4px 12px;gap:10px;border-radius:0;flex-direction:column;align-items:center;display:flex}.btn.mt span{font-size:26px;line-height:1}.btn.mt b{font:400 9px var(--px)}
#dly,#mr,#m1,#m2,#m3,#m4{border-radius:0!important;transform:none!important;background:var(--pan)!important;color:var(--tx)!important;text-align:left}
#dly{border-color:var(--ye)!important;box-shadow:6px 6px 0 var(--ye)!important;padding:16px 16px 18px!important}
#dly b{font:400 13px/1.4 var(--px)!important;letter-spacing:0!important;margin-top:10px!important;color:var(--tx)}
#dly>span:not(.pill):not(.go){font:700 15px/1.35 var(--bd)!important;color:var(--soft);font-weight:700}
#mr{border-color:var(--sh)!important;box-shadow:6px 6px 0 var(--sh)!important}
#mr b{font:400 12px var(--px)!important;color:var(--sh)}#mr small{font:700 14px var(--bd)!important;color:var(--soft);display:block;margin-top:8px}
#m1,#m3,#m4{border-color:var(--cy)!important;box-shadow:none!important}#m1 b,#m3 b,#m4 b{color:var(--cy)}
#m1:active,#m3:active,#m4:active{background:var(--pan2)!important;transform:none}
#m2{border-color:var(--tx)!important;box-shadow:none!important}
#m2 b{font:400 12px var(--px)!important;color:var(--tx)}#m2 small{font:700 14px var(--bd)!important;color:var(--soft);display:block;margin-top:8px}
#m2 svg,.btn.mt span{color:var(--cy)}#mr svg{color:var(--sh)}
.sub{margin:2px 0}
/* Antippbares hervorheben (alle Designs) */
.card,.rk{border:2px solid var(--dim)!important;box-shadow:none;background:var(--pan)}
.btn.ghost{border:3px solid var(--tx);color:var(--tx);box-shadow:4px 4px 0 var(--acc);background:var(--pan2)}
.btn.ghost:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--acc)}
.chip,.fchip{border:2px solid var(--tx);box-shadow:3px 3px 0 var(--dim);background:var(--pan2)}
.fcard{border:3px solid var(--tx);box-shadow:4px 4px 0 var(--dim)}

 if(!run){run=true;(function l(){cx.clearRect(0,0,cv.width,cv.height);ps=ps.filter(p=>p.y<cv.height+20);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.r+=.2;cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()});if(ps.length)requestAnimationFrame(l);else run=false})()}}

  total_ms integer not null check (total_ms between 500 and 3600000),

  created_at timestamptz not null default now()
);
create index on public.results (code, total_ms);
alter table public.results enable row level security;
create policy "alle duerfen lesen" on public.results for select to anon using (true);
create policy "alle duerfen eintragen" on public.results for insert to anon with check (true);`;
