/* ===== Design „Automat“ ===== */
:root{--bg:#0e0b1a;--pan:#1a1530;--pan2:#241d47;--tx:#f4f1ff;--soft:#c9c2ea;--dim:#3a3463;--mut:#8c84b8;--ink:#f4f1ff;--cy:#19f0ff;--ye:#ffe53b;--pk:#ff2e93;--gr:#7cff6b;--acc:#19f0ff;--sh:#ff2e93;--yel:#ffe53b;--cyan:#19f0ff;--grn:#7cff6b;--red:#ff2e93;--pink:#ff2e93;
--px:'Press Start 2P',ui-monospace,Menlo,Consolas,monospace;--vt:'VT323',ui-monospace,Menlo,Consolas,monospace;--ff:var(--px);--bd:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
--b1:#1a1530;--b2:#241d47;--c1:#1a1530;--c2:#1a1530;--tb:#0e0b1a;--g1:#0e0b1a;--g2:#0e0b1a;color-scheme:dark}
body{background-color:var(--bg)!important;background-image:linear-gradient(color-mix(in srgb,var(--acc) 9%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--acc) 9%,transparent) 1px,transparent 1px)!important;background-size:28px 28px!important;background-attachment:fixed!important;color:var(--tx);font:700 15px/1.35 var(--bd)}
#bgf{display:none}
#ver{color:var(--mut)!important;font:400 7px var(--px)}
.mut,.sub,.hint{color:var(--mut)}
.hint{font-size:13px}
/* Schrift: Pixel für Titel, Knöpfe, Zahlen */
.btn,.logo,.hud #tm,.big,.cd,.eq,.banner,.pen,.tile,.chip,.pill,.eloB b,.tabs button,.rk b,h1,h2,h3{font-family:var(--px)}
h2,h3{font-weight:400;line-height:1.5}
h3{font-size:11px;margin:10px 0 6px;color:var(--ye)}
h2{font-size:13px}
.btn{background:var(--acc);color:var(--bg);border:4px solid var(--acc);border-radius:0;box-shadow:5px 5px 0 var(--sh);padding:15px 10px 13px;font-size:12px;font-weight:400;line-height:1.5;letter-spacing:0;transition:none}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--sh)}
.btn::after{display:none}
.btn.pink{background:var(--pk);border-color:var(--pk);color:var(--tx);box-shadow:5px 5px 0 var(--ye)}
.btn.ghost{background:var(--pan);color:var(--tx);border:3px solid var(--mut);box-shadow:none}
.btn.ghost:active{transform:none;background:var(--pan2)}
.btn.sm{padding:11px 8px 9px;font-size:10px;border-radius:0}
.btn:disabled{opacity:.4}
.card{background:var(--pan);border:3px solid var(--mut)!important;border-radius:0;box-shadow:none;color:var(--tx)}
.card.dp,.card.ar{border-left-width:3px;border-radius:0;padding-left:14px}
.ar{border-left:3px solid var(--mut);border-radius:0}
.dp,.ar{color:var(--tx)!important;background:var(--pan)!important;box-shadow:5px 5px 0 var(--c)!important;border:3px solid var(--c)!important;border-radius:0!important;--c:var(--cy)}
.grid .dp:nth-child(3n+1),.grid .ar:nth-child(4n+1){--c:var(--cy)}
.grid .dp:nth-child(3n+2),.grid .ar:nth-child(4n+2){--c:var(--ye)}
.grid .dp:nth-child(3n),.grid .ar:nth-child(4n+3){--c:var(--pk)}
.grid .ar:nth-child(4n){--c:var(--gr)}
.chip,.fchip,.frx button{background:var(--pan);border:2px solid var(--mut);color:var(--tx);border-radius:0}
.chip{padding:6px 10px 4px;font-size:9px;font-weight:400}
.fchip b{color:var(--ye)}.fchip.me{outline:3px solid var(--ye);outline-offset:1px;background:var(--pan2)}

 else if(!rejoin)throw Object.assign(new Error('dup'),{dup:true});

const SQL=`create table public.results (
  id bigint generated always as identity primary key,
  code text not null check (char_length(code) between 8 and 30),
  name text not null check (char_length(name) between 1 and 14),
  total_ms integer not null check (total_ms between 500 and 3600000),
  pen_ms integer not null default 0 check (pen_ms >= 0),
  games jsonb not null default '{}',
  created_at timestamptz not null default now()
);
create index on public.results (code, total_ms);
alter table public.results enable row level security;
create policy "alle duerfen lesen" on public.results for select to anon using (true);
create policy "alle duerfen eintragen" on public.results for insert to anon with check (true);`;
